name: Build, Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate NexusRAG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax & Core Modules
        run: |
          python -m py_compile streamlit_app.py app.py src/rag/streamlit_app.py src/rag/search.py src/rag/multi_search.py
          echo "All Python modules compiled successfully."

      - name: Smoke Test Streamlit App Initialization
        env:
          STREAMLIT_SERVER_HEADLESS: "true"
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('src').resolve()))
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('streamlit_app.py', default_timeout=30)
          at.run()
          print('AppTest complete. Exceptions count:', len(at.exception))
          assert len(at.exception) == 0, f'App raised exceptions: {at.exception}'
          print('Streamlit App validation passed with 0 exceptions.')
          "

  docker-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nexusrag:latest
