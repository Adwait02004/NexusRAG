[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adwait02004", email = "sahasrabudheadwaitr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.7",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
]

[project.scripts]
rag = "rag:main"

[tool.uv]
link-mode = "copy"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
