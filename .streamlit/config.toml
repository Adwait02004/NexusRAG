[server]
fileWatcherType = "none"
folderWatchBlacklist = ["**/site-packages/**", "**/.venv/**"]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#f1f5f9"
font = "sans serif"
